<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <p class="eyebrow">MY COLLECTION</p>
    <h1>Image Gallery</h1>
    <p class="subtitle">A little collection of beautiful moments.</p>
  </header>

  <main class="gallery" aria-label="Photo gallery">
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900" alt="Mountain lake surrounded by mountains">
      <figcaption><span>Mountain Escape</span><small>Nature</small></figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900" alt="Beautiful landscape under a wide sky">
      <figcaption><span>Open Skies</span><small>Landscape</small></figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900" alt="Pink flowers in bloom">
      <figcaption><span>Spring Bloom</span><small>Flowers</small></figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900" alt="Lake and mountain scenery">
      <figcaption><span>Quiet Waters</span><small>Travel</small></figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=900" alt="Ocean waves reaching the shore">
      <figcaption><span>Ocean Blue</span><small>Ocean</small></figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900" alt="Golden sunrise over a field">
      <figcaption><span>Golden Morning</span><small>Sunrise</small></figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900" alt="Sunlight passing through a green forest">
      <figcaption><span>Forest Path</span><small>Nature</small></figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900" alt="Starry night sky">
      <figcaption><span>Starry Night</span><small>Night</small></figcaption>
    </figure>
  </main>

  <footer>Made with HTML &amp; CSS</footer>
  <script src="script.js"></script>
</body>
</html>
